# gsk_workflow_config.ini
# All paths are relative to the working root unless absolute.
# Lines starting with # or ; are comments.

[folders]
config_dir = 00_config
script_dir = 01_scripts
working_dir = 02_working

[working]
workflow_log = 02_working/gsk_workflow.log
error_log = 02_working/gsk_error.log
run_status_csv = 02_working/gsk_run_status.csv
workflow_status = 02_working/gsk_workflow_status.txt

[format]
legend_file = 00_config/legend_default.tcl

[workflow]
run_order = 02
stop_on_error = true
write_log = true
write_status = true

[script_02]
enabled = true
file = _tcl_gsk_02_apply_contact_pressure_legend.tcl
proc = ::gsk::step02::run
title = Apply Contact Pressure Legend
